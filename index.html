<style>
:root {
  --bg1:#1a120b; --bg2:#2a1c12; --bg3:#3a2418; --card:#2c1e14; --card2:#24180f; --line:#5c4033;
  --text:#f5e6d3; --muted:#c4a882; --mint:#e8a54b; --red:#c45c26; --redh:#d46a30;
  --hero:linear-gradient(125deg,#3d2415,#8b4513,#c45c26); --heroAccent:#ffb347; --heroKicker:#ffb347; --heroText:#f5e6d3;
  --ok:#81c784; --warn:#ffb74d; --err:#e57373; --info:#90a4ae;
  --font: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { font-family:var(--font); background:color-mix(in srgb, var(--bg1) 55%, #000); color:var(--text); -webkit-text-size-adjust:100%; }
.stage { min-height:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
.phone { position:relative; width:392px; height:min(844px, calc(100vh - 32px)); min-height:560px; display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg1); color-scheme:dark; border-radius:38px; border:9px solid #0b0b0d; box-shadow:0 0 0 2px #2b2b30, 0 30px 80px rgba(0,0,0,.55); }
@media (max-width:480px) {
  .stage { padding:0; align-items:stretch; }
  .phone { width:100%; height:100dvh; min-height:0; border:0; border-radius:0; box-shadow:none; }
}
.appbar { flex:none; display:flex; align-items:center; justify-content:center; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; background:var(--bg2); border-bottom:1px solid var(--line); }
.brand { font-weight:800; font-size:17px; letter-spacing:-.01em; }
.screen { flex:1; overflow-y:auto; padding:16px 16px 28px; display:flex; flex-direction:column; gap:12px; scroll-behavior:auto; outline:none; }
.screen > * { flex-shrink:0; }
#home-sugg:empty { display:none; }
.tabs { flex:none; display:grid; grid-template-columns:repeat(5,1fr); background:var(--bg2); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
.tab { background:none; border:0; color:var(--muted); font:inherit; font-size:11.5px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border-radius:12px; cursor:pointer; }
.tab svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.tab[aria-current="page"] { color:var(--mint); font-weight:700; background:color-mix(in srgb, var(--mint) 14%, transparent); }
button, select, input, textarea { font:inherit; color:inherit; }
button, a, select { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
:focus-visible { outline:2px solid var(--mint); outline-offset:2px; }
h1,h2,h3,p { margin:0; }
h1 { font-size:27px; line-height:1.12; letter-spacing:-.025em; font-weight:800; color:var(--mint); }
h2 { font-size:19px; font-weight:800; letter-spacing:-.01em; }
h3 { font-size:17px; font-weight:750; letter-spacing:-.005em; }
.sub { color:var(--muted); font-size:13.5px; line-height:1.45; }
.sm { font-size:12.5px; } .xs { font-size:11.5px; }
.muted { color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.hero { border-radius:20px; padding:20px; background:var(--hero); color:var(--heroText); display:flex; flex-direction:column; gap:8px; }
.hero .leaf { font-size:42px; line-height:1; }
.hero .kicker { color:var(--heroKicker); font-weight:700; font-size:12.5px; }
.hero h1 { color:var(--heroText); font-size:29px; }
.hero p { font-size:13.5px; line-height:1.5; }
.row { display:flex; flex-wrap:wrap; gap:8px; }
.btn { display:inline-flex; align-items:center; justify-content:center; text-align:center; gap:6px; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:12px;
  padding:10px 14px; font-weight:650; font-size:14px; text-decoration:none; cursor:pointer; line-height:1.2; }
.btn:hover { border-color:var(--mint); }
.btn.primary { background:var(--red); border-color:var(--red); color:#fff; }
.btn.primary:hover { background:var(--redh); }
.btn.link { color:var(--mint); background:transparent; }
.btn.plain { background:none; border:0; color:var(--mint); padding:6px 2px; }
.btn.full { width:100%; }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.field { display:flex; flex-direction:column; gap:5px; }
.field > span { font-size:13px; color:var(--muted); }
select, input[type=text], input[type=search], input[type=number], textarea { width:100%; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; }
textarea { resize:vertical; min-height:84px; }
input[type=range] { width:100%; accent-color:var(--red); }
.switch { display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
.switch input { width:20px; height:20px; accent-color:var(--red); }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:thin; }
.chip { flex:none; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:8px 13px; font-size:13.5px; cursor:pointer; white-space:nowrap; }
.chip[aria-pressed="true"] { background:var(--red); border-color:var(--red); color:#fff; font-weight:700; }
.metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metrics.three { grid-template-columns:repeat(3,1fr); gap:8px; }
.metric { background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
.metric small { display:block; color:var(--muted); font-size:12px; margin-bottom:3px; }
.metric b { font-size:18px; letter-spacing:-.01em; overflow-wrap:anywhere; }
.metrics.three .metric b { font-size:16px; }
.note { border:1px solid var(--info); background:var(--card2); border-radius:12px; padding:11px 12px; font-size:13.5px; line-height:1.45; }
.note.error { border-color:var(--err); } .note.warning { border-color:var(--warn); } .note.success { border-color:var(--ok); }
.facts-list { display:flex; flex-direction:column; gap:7px; font-size:14px; line-height:1.4; }
.badge { color:var(--mint); font-size:13px; font-weight:650; }
.place { gap:4px; }
.lock { align-items:center; text-align:center; gap:10px; padding:18px 14px; }
.lock .big { font-size:34px; }
.lock ul { text-align:left; margin:0; padding-left:18px; font-size:13.5px; line-height:1.55; }
.about p { font-size:13.5px; line-height:1.5; margin:0 0 8px; }
.toast { position:absolute; left:16px; right:16px; bottom:84px; background:#0b0b0d; color:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-size:13.5px;
  opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .2s, transform .2s; z-index:5; }
.toast.show { opacity:1; transform:none; }
.modal { position:absolute; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center; justify-content:center; padding:18px; z-index:6; }
.modal[hidden] { display:none; }
.dialog { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; width:100%; max-height:84%; display:flex; flex-direction:column; gap:10px; }
.dialog pre { margin:0; overflow:auto; white-space:pre-wrap; font:12.5px/1.5 var(--font); background:var(--card2); border-radius:10px; padding:10px; user-select:text; }
.footer { color:var(--muted); font-size:11.5px; line-height:1.45; }
@media (prefers-reduced-motion: reduce) { .toast { transition:none; } }
</style>

<script>
'use strict';
/* ====================================================================================================
   This is BC (phone layout). One file: open it in any browser. Data is embedded below.
   To collect Feedback answers, paste your Google Apps Script web app address between the quotes.
   ==================================================================================================== */
const CONFIG = { feedbackUrl: "" };
const DEMO_UNLOCK = true;   // The Upgrade button unlocks Premium for the demo. No payments are taken.

const D = JSON.parse(document.getElementById('bc-data').textContent);
const { cities, jobs: JOBS, extra: EXTRA, places: PLACES, placesData, services: SERVICES, sinOffices: SIN, themes: THEMES,
        sort: SORT, sortModes: SORT_MODES, sortHints: SORT_HINTS, climateLabels: CLIMATE, fitIcons: FIT_ICONS } = D;

/* ---------- number helpers that match Python (so the numbers equal the web app's) ---------- */
const pyRound = x => (Math.abs(x % 1) === 0.5 ? 2 * Math.round(x / 2) : Math.round(x));   // Python rounds .5 to the even number
const int = x => pyRound(x).toLocaleString('en-US');
const money = x => '$' + int(x);
const signedMoney = x => (x >= 0 ? '+' : '-') + '$' + int(Math.abs(x));
const g = x => String(Number(Number(x).toPrecision(6)));                                   // like Python {x:g}
const titleCase = s => s.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const quote = s => encodeURIComponent(s).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase()).replace(/%2F/g, '/');
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const parseNumber = (text, dflt = 0) => { const c = String(text ?? '').replace(/[^\d.]/g, ''); const n = parseFloat(c); return c && Number.isFinite(n) ? n : dflt; };

/* ---------- city logic (ported from the Python app) ---------- */
const formatPop = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n.toLocaleString('en-US') : 'Not available'; };
const getCsi = text => { const m = /CSI\s+(\d+(?:\.\d+)?)/.exec(String(text ?? '')); return m ? parseFloat(m[1]) : null; };
const csiText = c => { const v = getCsi(c.crime ?? ''); return v === null ? 'Not available' : `${g(v)} (lower is safer)`; };
const csiHelp = () => 'Crime Severity Index (CSI): lower numbers mean less serious crime. Rough BC mid-size average is around 100–120. Not a complete measure of personal safety.';
const rentValue = c => { const m = /^\s*\$\s*(\d[\d,]*(?:\.\d+)?)/.exec(String(c.rent1br ?? '')); return m ? parseFloat(m[1].replace(/,/g, '')) : null; };
const shortRent = c => {
  const rent = c.rent1br;
  if (rentValue(c) === null) return rent ? 'Not published' : 'Not available';
  return typeof rent === 'string' && rent ? rent.replaceAll(' average', '') : (rent ? String(rent) : 'Not available');
};
const veganLabel = c => {
  const raw = String(c.vegan ?? '').trim().toLowerCase();
  if (!raw || ['not available', 'n/a', 'unknown'].includes(raw)) return 'Not available';
  const map = { excellent: 'Excellent', good: 'Good', some: 'Some / Limited', limited: 'Limited', few: 'Few' };
  return map[raw] ?? titleCase(raw);
};
const veganScore = value => {
  const text = String(value ?? '').trim().toLowerCase();
  if (!text || ['not available', 'n/a', 'unknown'].includes(text)) return null;
  if (!Number.isNaN(Number(text))) return Number(text);
  if (/\b(limited|low|few|poor|minimal|little|none|no)\b/.test(text)) return 1;
  if (/\b(excellent|outstanding|abundant|very high|very good|plenty|many|thriving)\b/.test(text)) return 4;
  if (/\b(high|great|good|strong|yes|true|decent)\b/.test(text)) return 3;
  if (/\b(moderate|medium|some|average|growing)\b/.test(text)) return 2;
  return null;
};
const climateTier = c => {
  const manual = (EXTRA[c.name] || {}).climate_tier;
  if (manual) return manual;
  const lat = num(c.lat), lng = num(c.lng);
  if (lat === null || lng === null) return null;
  if (lat < 51 && lng < -121.5) return 1;
  if (lat < 51.5) return 2;
  return 3;
};
const cityPeople = c => c.people || (EXTRA[c.name] || {}).people;
const cityFoods = c => c.foods || (EXTRA[c.name] || {}).foods;
const cityJobs = c => c.jobs || JOBS[c.name];
const cityByName = n => cities.find(c => c.name === n) || null;

const sortValue = (c, mode) => {
  if (mode === SORT.VEGAN) { const s = veganScore(c.vegan); return s === null ? null : -s; }
  if (mode === SORT.LOW_RENT) return rentValue(c);
  if (mode === SORT.HIGH_RENT) { const r = rentValue(c); return r === null ? null : -r; }
  if (mode === SORT.SAFE) return getCsi(c.crime ?? '');
  if (mode === SORT.MILD) return climateTier(c);
  if (mode === SORT.BIG) { const n = parseInt(c.pop2021, 10); return Number.isFinite(n) ? -n : null; }
  return 0;
};
const nameKey = c => String(c.name ?? '').toLowerCase();
const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const sortCities = (items, mode) => {
  const scored = items.map(c => [sortValue(c, mode), c]);
  const ranked = scored.filter(p => p[0] !== null).sort((a, b) => (a[0] - b[0]) || cmpStr(nameKey(a[1]), nameKey(b[1])));
  const missing = scored.filter(p => p[0] === null).map(p => p[1]).sort((a, b) => cmpStr(nameKey(a), nameKey(b)));
  return ranked.map(p => p[1]).concat(missing);
};
const sortBadge = (c, mode) => {
  if (mode === SORT.VEGAN) { const v = veganLabel(c); return v !== 'Not available' ? `🥬 ${v}` : '🥬 No data'; }

const COST_PCT = { 'Rent (1-bedroom)': 0.30, 'Groceries': 0.12, 'Transit / transport': 0.05, 'Utilities & internet': 0.05, 'Phone': 0.02, 'Entertainment & dining': 0.06 };

  const m = level.includes('very high') ? 1.25 : level.includes('high') ? 1.1 : level.includes('low') ? 0.9 : 1.0;

    'Phone': 60, 'Entertainment & dining': pyRound(200 * m) }, est === null];

const costSummary = (city, income, actual) => {

  const actualTotal = Object.keys(typical).reduce((s, k) => s + (Number(actual[k]) || 0), 0);
  const out = { typical, typicalTotal, rentMissing, actualTotal, income, messages: [],
    typicalPct: income > 0 ? typicalTotal / income * 100 : null, leftTypical: income - typicalTotal,
    spentPct: income > 0 ? actualTotal / income * 100 : null, left: income - actualTotal, vsTypical: actualTotal - typicalTotal };
  if (income <= 0 || actualTotal <= 0) { out.messages.push(['info', 'Enter your income and at least some spending to get personalized advice.']); return out; }
  const over = [];
  for (const [item, typ] of Object.entries(typical)) {

/* ---------- rendering and routing ---------- */
const TAB_OF = { home: 0, explore: 1, city: 1, compare: 2, shortlist: 3 };
const render = (keepScroll = false) => {
  applyTheme();
  const [kind, arg] = [state.route.split(':')[0], state.route.split(':').slice(1).join(':')];
  const screen = $('#screen'), top = screen.scrollTop;
  screen.innerHTML = (views[kind] || views.home)(arg);
  screen.scrollTop = keepScroll ? top : 0;
  document.querySelectorAll('.tab').forEach((t, i) => { if (i === (TAB_OF[kind] ?? 4)) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
};
const go = route => { state.route = route; render(); };
const part = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

/* ---------- sending (Feedback and demand signals) ---------- */
const sendPayload = async payload => {
  if (!CONFIG.feedbackUrl) return null;                      // null: nowhere to send, kept on this device
  try { await fetch(CONFIG.feedbackUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); return true; }
  catch { return false; }
};
const nowIso = () => new Date().toISOString().replace(/\.\d+Z$/, 'Z');
const event = (kind, detail = '') => { if (CONFIG.feedbackUrl) sendPayload({ type: kind, channel: 'mobile-html', time_utc: nowIso(), detail }); };
const safeCell = v => { const s = String(v ?? ''); return '=+-@'.includes(s[0] || ' ') ? "'" + s : s; };
const toCsv = rows => { const cols = ['time_utc', 'type', 'channel', 'who', 'helped', 'useful', 'used_before', 'would_pay', 'missing'];
  return [cols.join(',')].concat(rows.map(r => cols.map(c => '"' + safeCell(r[c]).replaceAll('"', '""') + '"').join(','))).join('\r\n'); };

/* ---------- actions ---------- */
const actions = {
  tab: a => go(['home', 'explore', 'compare', 'shortlist', 'more'][+a]),
  go: a => go(a),
  open: a => go('city:' + a),
  save: a => { const i = state.shortlist.indexOf(a); if (i >= 0) state.shortlist.splice(i, 1); else state.shortlist.push(a); persist(); render(true); },
  cmp: a => {
    const i = state.compare.indexOf(a);
    if (i >= 0) { state.compare.splice(i, 1); toast(`${a} removed from your comparison`); }
    else if (state.compare.length < 3) { state.compare.push(a); toast(`${a} added to your comparison`); }
    else toast('You can compare up to 3 cities. Remove one first.');
    render(true);
  },
  cmpdel: a => { state.compare = state.compare.filter(n => n !== a); render(true); },
  sort: a => { state.sort = a; render(true); },
  shuffle: () => { const pool = names.slice(); for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; } state.featured = pool.slice(0, 3); render(true); },
  pick: (a, b) => { if (b === 'city') go('city:' + a); else { state.region = a; state.q = ''; go('explore'); } },
  upgrade: a => { event('upgrade_click', a || 'unknown'); if (DEMO_UNLOCK) { state.premium = true; toast('⭐ Premium unlocked for this demo session.'); render(true); } else toast('Premium isn’t available in this prototype yet.'); },
  free: () => { state.premium = false; render(true); },
  interest: () => { event('advisor_interest'); toast('Thanks, noted. Your interest helps us decide what to build next.'); },
  share: () => openDialog(`<h3>My shortlist</h3><pre id="share-text">${esc(reportText(state.shortlist.map(cityByName).filter(Boolean), state.budget))}</pre>
    <div class="row">${btn('Copy', 'copy', '', 'primary')}${btn('Close', 'close')}</div>`),
  copy: async () => {
    const text = $('#share-text').textContent;
    try { await navigator.clipboard.writeText(text); toast('Copied to your clipboard'); }
    catch { const r = document.createRange(); r.selectNodeContents($('#share-text')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(document.execCommand && document.execCommand('copy') ? 'Copied to your clipboard' : 'Select the text and copy it'); }
  },
  close: () => closeDialog(),
  install: async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => null);
    installPrompt = null; render(true);
  },
  locate: () => {
    if (!navigator.geolocation) return toast('Your browser can’t share a location.');
    navigator.geolocation.getCurrentPosition(p => { state.myLoc = [p.coords.latitude, p.coords.longitude]; state.servicesCity = D.myLocation; render(true); },
      () => toast('Couldn’t get your location. Pick a city instead.'), { timeout: 8000 });
  },
  fbagain: () => { state.fbSent = false; render(true); },
  fbsend: async () => {
    const f = state.fb;
    if (!f.who || !f.useful) return toast('Please answer the first and third questions.');
    const payload = { type: 'feedback', channel: 'mobile-html', time_utc: nowIso(), who: f.who, helped: f.helped, useful: f.useful,
      used_before: f.used === USED_BEFORE ? 'Yes' : 'No', would_pay: f.pay, missing: f.missing.trim() };

    if (state.fbStatus !== true) state.pending.push(payload);

  },
  fbflush: async () => {
    for (const p of state.pending.slice()) { if (await sendPayload(p) !== true) break; state.pending.splice(state.pending.indexOf(p), 1); }
    persist(); render(true);
  },
  fbcsv: () => {
    const url = URL.createObjectURL(new Blob([toCsv(state.pending)], { type: 'text/csv' })), a = document.createElement('a');
    a.href = url; a.download = 'this-is-bc-feedback.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
};
const openDialog = html => { $('#dialog').innerHTML = html; $('#modal').hidden = false; };
const closeDialog = () => { $('#modal').hidden = true; };

/* ---------- events (one listener each) ---------- */
document.addEventListener('click', e => {

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });
const inputs = {
  homeq: v => part('home-sugg', searchMatches(v).map(([label, kind]) =>
    `<button class="btn plain full" style="justify-content:flex-start" data-act="pick" data-a="${esc(label)}" data-b="${kind}">${kind === 'city' ? '' : 'Region: '}${esc(label)}</button>`).join('')),
  exq: v => { state.q = v; part('ex-results', exploreList()); },
  costIncome: v => { state.costIncome = parseNumber(v); part('cost-results', costResults()); },

document.addEventListener('input', e => {
  const key = e.target.dataset && e.target.dataset.in;
  if (!key) return;

document.addEventListener('change', e => {
  const key = e.target.dataset && e.target.dataset.ch, v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (!key) return;
  if (key === 'region') { state.region = v; render(true); }

  else if (key === 'showDiff') { state.showDiff = v; render(true); }
  else if (key === 'cmpadd') { if (v && !state.compare.includes(v) && state.compare.length < 3) state.compare.push(v); render(true); }
  else if (key === 'costCity') { state.costCity = v; render(true); }
  else if (key === 'servicesCity') { state.servicesCity = v; render(true); }
  else if (key === 'theme') { state.theme = v; persist(); render(true); }
  else if (key.startsWith('fb:')) state.fb[{ 'fb:who': 'who', 'fb:useful': 'useful', 'fb:used': 'used', 'fb:pay': 'pay' }[key]] = v;
});
